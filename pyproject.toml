[project]
name = "bling-trello-sync"
version = "0.1.0"
description = "Integração que cria cards no Trello a partir de pedidos de venda do Bling"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg[binary]>=3.1,<4.0",
]

[tool.setuptools.packages.find]
include = ["bling_trello_sync*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends() em argumentos padrão é o padrão de injeção de dependências do FastAPI.
"bling_trello_sync/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bling_trello_sync"]
omit = [
    "bling_trello_sync/oauth_local.py",
    "bling_trello_sync/cli.py",
    "bling_trello_sync/tipos.py",
]

[tool.coverage.report]
show_missing = true
