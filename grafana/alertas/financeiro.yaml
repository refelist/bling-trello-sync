# Provisionamento de alertas unificados (Grafana 10+).
# Copiado por grafana/instalar.sh para /etc/grafana/provisioning/alerting/
apiVersion: 1

groups:
  - orgId: 1
    name: financeiro_coleta
    folder: Financeiro
    interval: 15m
    rules:
      - uid: fin-coleta-atrasada
        title: Coleta financeira atrasada
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: financeiro
            model:
              editorMode: code
              format: table
              rawQuery: true
              rawSql: >
                SELECT COALESCE(
                         EXTRACT(EPOCH FROM (NOW() - MAX(coletado_em::timestamptz))) / 3600.0,
                         999
                       ) AS "Horas"
                  FROM vw_coleta_meta
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [6]
                  operator:
                    type: and
                  type: query
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: A coleta Bling → Postgres está atrasada há mais de 6 horas.
          description: >
            Verifique o serviço bling-trello-sync / sincronizar-financeiro e a tabela coleta_meta.
        labels:
          severity: warning
          equipe: financeiro

      - uid: fin-bling-429
        title: Muitos HTTP 429 na coleta financeira
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: financeiro
            model:
              editorMode: code
              format: table
              rawQuery: true
              rawSql: >
                SELECT COALESCE(SUM(bling_429), 0) AS "429"
                  FROM vw_coleta_meta
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
                  operator:
                    type: and
                  type: query
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 0m
        annotations:
          summary: A última coleta financeira acumulou mais de 10 respostas HTTP 429 do Bling.
          description: >
            Reduza o período, use filtros secundários curtos ou aumente o intervalo entre coletas.
        labels:
          severity: warning
          equipe: financeiro
